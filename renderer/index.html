<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Strata no habla con la
     red: todo lo que lee sale de la base abierta, por IPC. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Strata</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/strata.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado.
     (tools/retint.mjs lo mantiene en sincronía.) */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0b0a09;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; fill: none; stroke: #deb176;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: primero el bloque, después las vetas. */
  #boot-splash rect { stroke-dasharray: 42; stroke-dashoffset: 42;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path { stroke-dasharray: 13; stroke-dashoffset: 13; opacity: .55;
                      animation: boot-draw .6s cubic-bezier(.16,1,.3,1) .16s forwards; }
  #boot-splash path:last-child { animation-delay: .26s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<!-- La marca: tiene que coincidir con BRAND de js/strata/icons.js. -->
<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <rect x="2.3" y="2.3" width="11.4" height="11.4" rx="2.6"/>
    <path d="M2.3 6.4c1.9-.9 3.8-.9 5.7 0s3.8.9 5.7 0"/>
    <path d="M2.3 9.9c1.9.9 3.8.9 5.7 0s3.8-.9 5.7 0"/>
  </svg>
</div>

<div class="op-app st-bare">

  <!-- El sustrato: la niebla que el vidrio difumina. Una capa, estática. -->
  <div class="op-fog" aria-hidden="true"></div>

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────── -->
  <header class="op-titlebar">
    <div class="op-brand op-no-drag">
      <svg class="op-brand__mark op-icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="2.3" y="2.3" width="11.4" height="11.4" rx="2.6"/>
        <path class="op-brand__trail" d="M2.3 6.4c1.9-.9 3.8-.9 5.7 0s3.8.9 5.7 0"/>
        <path class="op-brand__trail" d="M2.3 9.9c1.9.9 3.8.9 5.7 0s3.8-.9 5.7 0"/>
      </svg>
      <span class="op-brand__name">Strata</span>
    </div>

    <!-- La base abierta, al centro. -->
    <div class="op-titlebar__context" id="titlebar-context"></div>

    <div class="op-wincontrols">
      <button class="op-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="op-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="op-wincontrol op-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <div class="op-body">

    <!-- ── Rail: la base y su esquema ───────────────────────────────────── -->
    <nav class="op-rail">
      <div class="op-rail__top st-railtop">
        <button class="st-dbbtn" id="rail-db"></button>
        <div class="op-inputwrap st-railfilter">
          <i data-icon="search"></i>
          <input class="op-input" id="rail-filter" placeholder="Filtrar objetos" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="op-rail__nav op-scroll" id="rail-nav"></div>
    </nav>

    <!-- ── Vista ────────────────────────────────────────────────────────── -->
    <main class="op-main" id="view"></main>
  </div>

  <!-- ── Statusbar ──────────────────────────────────────────────────────── -->
  <footer class="op-statusbar">
    <div class="op-statusbar__item st-stat-db" data-tip-side="top">
      <i data-icon="database"></i> <span class="op-statusbar__value op-truncate" id="stat-db">Sin base abierta</span>
    </div>
    <div class="op-statusbar__item" data-needs-db data-tip="Tamaño del archivo (con el WAL, si hay)" data-tip-side="top">
      <span class="op-statusbar__value op-num" id="stat-size">—</span>
    </div>
    <div class="op-statusbar__item" data-needs-db data-tip="Codificación del texto" data-tip-side="top">
      <span class="op-statusbar__value" id="stat-enc">—</span>
    </div>
    <div class="op-statusbar__item" data-needs-db data-tip="Modo del journal" data-tip-side="top">
      <span class="op-statusbar__value" id="stat-journal">—</span>
    </div>
    <div class="op-spacer"></div>
    <button class="op-statusbar__item st-update" id="stat-update" hidden></button>
    <div class="op-statusbar__item" data-needs-db>
      <span id="stat-sqlite">SQLite</span>
    </div>
    <div class="op-statusbar__item st-readonly" data-tip="Strata abre todo en solo lectura: no hay forma de escribir la base" data-tip-side="top">
      <i data-icon="internal"></i> solo lectura
    </div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="op-layer"></div>

<script type="module" src="./js/app.js"></script>
